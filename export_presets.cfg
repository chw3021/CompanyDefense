html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover\">
<meta http-equiv=\"Cache-Control\" content=\"no-cache, no-store, must-revalidate\">
<meta http-equiv=\"Pragma\" content=\"no-cache\">
<style>
html,body{margin:0;padding:0;overflow:hidden;position:fixed;inset:0;width:100%;height:100%;background:#000;touch-action:none;-webkit-text-size-adjust:100%;}
#canvas{position:fixed;touch-action:none;display:block;}
</style>
<script>
// PC/모바일 모두 720x1280 비율로 맞춘다. iOS Safari 는 visualViewport 를 쓴다.
function fitCanvas() {
	const canvas = document.getElementById('canvas');
	if (!canvas) return;
	const vv = window.visualViewport;
	const iw = Math.max(1, vv ? vv.width : window.innerWidth);
	const ih = Math.max(1, vv ? vv.height : window.innerHeight);
	const ox = vv ? vv.offsetLeft : 0;
	const oy = vv ? vv.offsetTop : 0;
	const h = Math.min(ih, iw * 1280 / 720);
	const w = h * 720 / 1280;
	const dpr = Math.min(window.devicePixelRatio || 1, 2);
	canvas.style.width = w + 'px';
	canvas.style.height = h + 'px';
	canvas.style.left = (ox + (iw - w) / 2) + 'px';
	canvas.style.top = (oy + (ih - h) / 2) + 'px';
	canvas.style.transform = 'none';
	canvas.width = Math.round(w * dpr);
	canvas.height = Math.round(h * dpr);
	window.scrollTo(0, 0);
	if (vv && typeof vv.offsetTop === 'number') {
		try { window.scrollTo(0, 0); } catch (e) {}
	}
}
window.addEventListener('DOMContentLoaded', fitCanvas);
window.addEventListener('resize', fitCanvas);
window.addEventListener('orientationchange', fitCanvas);
if (window.visualViewport) {
	window.visualViewport.addEventListener('resize', fitCanvas);
	window.visualViewport.addEventListener('scroll', fitCanvas);
}
// GodotAudio 는 모듈 스코프라 window 에 없음. GDScript 가 window.__godotAudioContext 로 올려 줌.
// 제스처 핸들러에서 직접 resume + silent buffer 로 autoplay 잠금 해제.
function unlockGodotAudio(ev) {
	try {
		var ctx = window.__godotAudioContext
			|| (window.GodotAudio && window.GodotAudio.ctx)
			|| (typeof GodotAudio !== 'undefined' && GodotAudio.ctx)
			|| null;
		if (!ctx) {
			console.log('[Audio/html]', ev && ev.type, 'no-ctx-yet');
			return;
		}
		window.__godotAudioContext = ctx;
		var before = String(ctx.state);
		if (ctx.state === 'suspended' && ctx.resume) {
			ctx.resume().then(function () {
				console.log('[Audio/html] resume ok', before, '->', ctx.state);
			}).catch(function (e) {
				console.warn('[Audio/html] resume fail', e);
			});
		}
		try {
			var buf = ctx.createBuffer(1, 1, 22050);
			var src = ctx.createBufferSource();
			src.buffer = buf;
			src.connect(ctx.destination);
			src.start(0);
		} catch (e2) {}
		console.log('[Audio/html]', ev && ev.type, 'state=' + ctx.state);
	} catch (e) {
		console.warn('[Audio/html] unlock error', e);
	}
}
['pointerdown','touchstart','mousedown','keydown'].forEach(function (ev) {
	window.addEventListener(ev, unlockGodotAudio, {passive:true, capture:true});
});
</script>"
